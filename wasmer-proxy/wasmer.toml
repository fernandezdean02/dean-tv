[package]
name = "fernandezdean02/dean-tv"
version = "0.1.0"

[dependencies]
"wasmer/python" = "^3.12.6"

[fs]
"/server.py" = "./api.py"
"/index.html" = "./index.html"
"/player.html" = "./player.html"
"/detail.html" = "./detail.html"
"/providers.json" = "./providers.json"
"/cpython/lib/python3.12/site-packages" = "./.env/lib/python3.12/site-packages"

[[command]]
name = "start"
module = "wasmer/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8080"]
