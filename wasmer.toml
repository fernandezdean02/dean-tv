[package]
name = "fernandezdean02/dean-tv"
version = "0.1.0"
description = "Dean TV streaming proxy"
readme = "README.md"

[dependencies]
"wasmer/python" = "^3.12.6"

[fs]
"/app.py" = "./app.py"
"/cpython/lib/python3.12/site-packages" = "./.env/lib/python3.12/site-packages"

[[command]]
name = "start"
module = "wasmer/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "-m", "uvicorn", "app:app",
    "--host", "0.0.0.0",
    "--port", "8080"
]
env = ["PYTHONEXECUTABLE=/bin/python"]
